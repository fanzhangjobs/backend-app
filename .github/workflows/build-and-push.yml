name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}"
            }

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/backendapp:${GITHUB_SHA} .

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Push image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/backendapp:${GITHUB_SHA}

      - name: Tag latest
        run: |
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/backendapp:${GITHUB_SHA} ${{ secrets.ACR_NAME }}.azurecr.io/backendapp:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/backendapp:latest
